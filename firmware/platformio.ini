; PlatformIO project for the ESP32 controller (open the "firmware" folder in VS Code).
; It builds the same esp32_controller.ino that Arduino IDE uses - nothing is duplicated.

[platformio]
src_dir = esp32_controller

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
